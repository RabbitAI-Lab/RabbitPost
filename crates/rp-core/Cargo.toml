[package]
name = "rp-core"
version = "0.1.0"
edition = "2021"
description = "RabbitPost core library shared by the runner and the CLI: HTTP engine, script sandbox, API client"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "gzip",
    "deflate",
    "multipart",
    "charset",
    "http2",
    "stream",
] }
rquickjs = { version = "0.9", features = ["futures", "parallel"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# 数据库连接执行层：MySQL/PostgreSQL/SQLite 走 sqlx（rustls，与 reqwest 一致），Redis 走 redis-rs
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "mysql",
    "sqlite",
    "chrono",
    "uuid",
    "json",
    "bigdecimal",
] }
redis = { version = "0.32", default-features = false, features = ["tokio-rustls-comp"] }
# 脚本沙箱 async 化后需要真实的 tokio（定时器/reactor）；二进制侧自建 runtime
tokio = { version = "1", features = ["time"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
futures = "0.3"
