[package]
name = "rp-core"
version = "0.1.0"
edition = "2021"
description = "RabbitPost core library shared by the runner and the CLI: HTTP engine, script sandbox, API client"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "gzip",
    "multipart",
    "charset",
    "http2",
] }
rquickjs = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
futures = "0.3"
