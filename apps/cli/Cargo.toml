[package]
name = "rabbitpost-cli"
version = "0.1.0"
edition = "2021"
description = "RabbitPost CLI — API CRUD for AI agents, local test-case execution, reports and upload"
publish = false

[[bin]]
name = "rabbitpost"
path = "src/main.rs"

[dependencies]
rp-core = { path = "../../crates/rp-core" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# spec lint 用：YAML 1.2 是 JSON 超集，一个解析器覆盖两种格式（与 Web 端 yaml 包一致）
serde_yaml = "0.9"
# rt 事件流（SSE）直接消费 rp-core 返回的 reqwest::Response
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"

[profile.release]
strip = true
