[package]
name = "rabbitpost-cli"
version = "0.1.0"
edition = "2021"
description = "RabbitPost CLI — API CRUD for AI agents, local test-case execution, reports and upload"
publish = false

[[bin]]
name = "rabbitpost"
path = "src/main.rs"

[dependencies]
rp-core = { path = "../../crates/rp-core" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"

[profile.release]
strip = true
