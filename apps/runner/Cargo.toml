[package]
name = "rabbitpost-runner"
version = "0.1.0"
edition = "2021"
description = "RabbitPost Runner — executes requests / collections dispatched by the server"
publish = false

[[bin]]
name = "rabbitpost-runner"
path = "src/main.rs"

[dependencies]
rp-core = { path = "../../crates/rp-core" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "signal",
] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
serde_json = "1"
wiremock = "0.6"

[profile.release]
strip = true
